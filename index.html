<!DOCTYPE html>
<html lang="en">
<head>
<script>
const search = document.getElementById("search");
const results = document.getElementById("results");
const count = document.getElementById("count");

let pdfs = [];

function displayResults() {
  const query = search.value.trim().toLowerCase();

  const matches = pdfs.filter(file =>
    file.split("/").pop().toLowerCase().includes(query)
  );

  results.replaceChildren();
  count.textContent = matches.length +
    (matches.length === 1 ? " PDF found" : " PDFs found");

  if (matches.length === 0) {
    results.textContent = "No matching PDFs found.";
    return;
  }

  matches.forEach(file => {
    const item = document.createElement("div");
    item.className = "result";

    const name = document.createElement("strong");
    name.textContent = file.split("/").pop();

    const actions = document.createElement("div");
    actions.className = "actions";

    const url = file.split("/").map(encodeURIComponent).join("/");

    const open = document.createElement("a");
    open.textContent = "Open PDF";
    open.href = url;
    open.target = "_blank";
    open.rel = "noopener";

    const download = document.createElement("a");
    download.textContent = "Download";
    download.href = url;
    download.download = file.split("/").pop();

    actions.append(open, download);
    item.append(name, actions);
    results.append(item);
  });
}

search.addEventListener("input", displayResults);

fetch("./pdf-list.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("PDF list not available");
    }
    return response.json();
  })
  .then(files => {
    pdfs = files;
    displayResults();
  })
  .catch(() => {
    count.textContent = "PDF list not ready.";
    results.textContent =
      "Please try again in a few minutes.";
  });
</script>
</body>
</html>
