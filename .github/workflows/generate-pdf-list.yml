
name: Automatically update PDF list

on:
  push:
    paths:
      - 'pdf/**'
      - '.github/workflows/generate-pdf-list.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-list:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate PDF filename list
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          folder = Path("pdf")
          files = []

          if folder.exists():
              files = sorted(
                  str(p.as_posix())
                  for p in folder.rglob("*")
                  if p.is_file() and p.suffix.lower() == ".pdf"
              )

          with open("pdf-list.json", "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)

          print(f"Found {len(files)} PDF files.")
          PY

      - name: Save updated list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-list.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatically update PDF list"
            git push
          else
            echo "PDF list is already up to date."
          fi
